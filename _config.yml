# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

# Set explicitly: GitHub Pages derives site.url without TLS when the certificate is
# terminated upstream, which leaves absolute URLs in meta tags on http. Everything the
# sitemap and the social cards emit has to be the canonical https address.
url: "https://dfmpproject.drayker.org"

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

title: "DFMPProject"
description: "Models for proposing a voluntary, collaborative project through DFM."

dk_kicker: "Projects"
dk_subdomain: "dfmpproject.drayker.org"
dk_repo: "https://github.com/draykerdk/dfmpproject"

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The mark, drawn by the shared engine in drayker-theme. Body, rings and wedge say what
# this part does to the planet; the colour is its scope. Scope colours come from
# DRAYKER-MARK.md §7 — never invent one. Parts with no assigned colour stay on the
# main accent until the mark owner assigns theirs.
dk_body: "grid"
dk_rings: "hairline"
dk_wedge: "none"
dk_accent: "#FFCB6B"
